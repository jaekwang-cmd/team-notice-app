<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title>할 일</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="tasks-widget.css" />
</head>
<body class="tasks-widget-body">
  <div class="tasks-widget">
    <div id="widget-signin-banner" class="widget-signin-banner hidden">
      <span>⚠️ 구글 로그인이 필요합니다</span>
      <button type="button" id="widget-signin-btn">로그인</button>
    </div>
    <div class="notice-list" id="memo-list"></div>
    <div class="memo-alarm-row">
      <label class="memo-alarm-toggle">
        <input type="checkbox" id="memo-alarm-enable" />
        <span>⏰ 시간 설정하기</span>
      </label>
      <input type="time" id="memo-alarm-time" class="hidden" />
    </div>
    <div class="notice-input">
      <input id="memo-text" type="text" placeholder="할 일을 입력하세요..." maxlength="500" />
      <button id="memo-send">보내기</button>
    </div>
  </div>

  <div id="memo-alarm-popup" class="chulgo-mini-overlay hidden">
    <div class="chulgo-mini-card">
      <h3>⏰ 알림</h3>
      <p id="memo-alarm-text" class="memo-alarm-popup-text"></p>
      <div class="chulgo-mini-actions">
        <button type="button" id="memo-alarm-close">확인</button>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script src="tasks-widget.js"></script>
</body>
</html>
